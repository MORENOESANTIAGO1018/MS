name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Placeholders — nenhuma credencial real deve existir em CI (Fase 15).
  # São suficientes para build/testes: o app roda inteiramente sobre os
  # adaptadores mock quando as chaves reais não estão presentes.
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder-ci.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-ci
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  verify:
    name: Lint, typecheck, testes unitários, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run build
      - name: npm audit (informativo — não bloqueia o merge)
        run: npm audit || true

  rls:
    name: Isolamento de RLS (Postgres efêmero)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Rodar supabase/tests/run-local.sh contra o Postgres do job
        run: bash supabase/tests/run-local.sh
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  e2e:
    name: Testes E2E (Playwright)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - name: Guardar relatório do Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
